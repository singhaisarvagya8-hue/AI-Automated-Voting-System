[build]
  command = "echo 'Build ready'"
  functions = "netlify/functions"
  publish = "static"

[build.environment]
  PYTHON_VERSION = "3.11"

[functions]
  directory = "netlify/functions"

# Direct static assets routing
[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

# Route all routes to the serverless WSGI Flask handler
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
